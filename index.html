<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logic Riddle - Fox Puzzle Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <div class="fox-logo" aria-hidden="true">🦊</div>
    <div>
      <h1>Logic Riddle</h1>
      <p>Fox Puzzle Solver</p>
    </div>
  </header>
  <p class="intro">Choose the board size. Place exactly one fox in every row, column and color. Foxes cannot touch, including diagonally.</p>

  <section class="panel">
    <div class="size-control">
      <label for="size">Board size</label>
      <select id="size">
        <option value="4">4 × 4</option><option value="5">5 × 5</option>
        <option value="6">6 × 6</option><option value="7">7 × 7</option>
        <option value="8">8 × 8</option><option value="9">9 × 9</option>
        <option value="10" selected>10 × 10</option><option value="11">11 × 11</option>
        <option value="12">12 × 12</option><option value="13">13 × 13</option>
        <option value="14">14 × 14</option><option value="15">15 × 15</option>
      </select>
      <button id="newBoard">New Board</button>
    </div>
    <div class="controls">
      <button id="solve">🦊 Solve</button>
      <button id="clearDogs">Clear Foxes</button>
      <button id="example">Load 10×10 Example</button>
      <button id="clearBoard">Clear Board</button>
    </div>
    <div id="legend" class="legend"></div>
  </section>

  <section class="panel board-panel">
    <div id="grid" class="grid"></div>
    <div id="status" class="status">Paint the board, then press Solve.</div>
    <pre id="solution"></pre>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
